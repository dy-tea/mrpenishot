name: Build (prod)

on:
  push:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup V
        uses: vlang/setup-v@v1.4

      - name: Install deps
        run: |
          sudo apt install libpixman-1-dev libjxl-dev libpng-dev

      - name: Install V wayland
        run: |
            mkdir ~/.vmodules
            git clone https://github.com/dy-tea/wayland.git ~/.vmodules/wayland

      - name: Build
        run: |
          v -prod .
